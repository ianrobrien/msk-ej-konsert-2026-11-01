<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101817">
    <title>Konsertreisen</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="slides.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <main class="stage" id="stage">
      <img class="photo-layer" id="photo-a" alt="" aria-hidden="true">
      <img class="photo-layer" id="photo-b" alt="" aria-hidden="true">
      <div class="scrim" aria-hidden="true"></div>
      <p class="photo-credit" id="photo-credit" aria-live="polite" hidden>
        <span id="photo-credit-label"></span>
        <span aria-hidden="true">·</span>
        <a
          id="photo-credit-source"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Åpne bildekilden"
        >Kilde</a>
      </p>

      <section class="travel-overlay" id="travel-overlay" aria-hidden="true">
        <div class="travel-header">
          <p class="travel-kicker" id="travel-kicker">PÅ REISE</p>
          <p class="travel-route-label" id="travel-route-label"></p>
        </div>
        <div class="map-frame">
          <img
            class="map-art"
            src="assets/world-map.svg"
            alt=""
            aria-hidden="true"
          >
          <svg
            class="route-layer"
            viewBox="0 0 1200 600"
            aria-hidden="true"
          >
            <path
              class="route-dots"
              id="route-dots"
              fill="none"
              stroke-linecap="round"
            ></path>
            <path
              class="route-active"
              id="route-active"
              fill="none"
              stroke-linecap="round"
            ></path>
            <g class="route-tracks">
              <path
                class="route-track-sleepers"
                id="route-track-sleepers"
                fill="none"
              ></path>
              <path
                class="route-track-rails"
                id="route-track-rails"
                fill="none"
              ></path>
            </g>
            <circle class="route-origin" id="route-origin" r="6"></circle>
            <circle class="route-destination" id="route-destination" r="8"></circle>
            <g class="flight-plane" id="flight-plane">
              <path
                class="plane-wing"
                d="M-4-9-21-2Q-23 0-21 2L-4-1-3 3H3L4-1 21 2Q23 0 21-2L4-9Z"
              ></path>
              <path
                class="plane-tail"
                d="M-2 13-9 19-8 22 0 19 8 22 9 19 2 13Z"
              ></path>
              <path
                class="plane-fuselage"
                d="M0-23C3-21 4-15 3-8L2 15 7 20 7 23 0 20-7 23-7 20-2 15-3-8C-4-15-3-21 0-23Z"
              ></path>
              <path class="plane-cockpit" d="M0-15C3-13 3-10 0-8-3-10-3-13 0-15Z"></path>
              <circle class="plane-window" cx="0" cy="-4" r="1.1"></circle>
              <circle class="plane-window" cx="0" cy="1" r="1.1"></circle>
              <path class="plane-wing-stripe" d="M-17 0H-8M8 0H17"></path>
              <path class="plane-propeller" d="M-5-22H5"></path>
              <circle class="plane-propeller-hub" cx="0" cy="-22" r="1.5"></circle>
            </g>
            <g class="travel-train" id="travel-train">
              <path
                class="train-smoke"
                d="M5-14c-4-4 0-8 4-6 2-5 9-3 8 1 5 2 3 7-1 8Z"
              ></path>
              <g class="train-wheels">
                <circle cx="-16" cy="8" r="4.2"></circle>
                <circle cx="-4" cy="8" r="4.2"></circle>
                <circle cx="9" cy="8" r="4.2"></circle>
                <path d="M-16 8H9"></path>
              </g>
              <path class="train-frame" d="M-24 3H17V6H-24Z"></path>
              <path class="train-cab" d="M-23-12H-10V4H-23Z"></path>
              <rect
                class="train-window"
                x="-20"
                y="-9"
                width="7"
                height="6"
                rx="1"
              ></rect>
              <path
                class="train-boiler"
                d="M-11-7H7A7 7 0 0 1 14 0V4H-11Z"
              ></path>
              <rect
                class="train-chimney"
                x="6"
                y="-14"
                width="5"
                height="8"
                rx="1"
              ></rect>
              <path class="train-chimney-cap" d="M4-15H13V-13H4Z"></path>
              <path class="train-cowcatcher" d="M14 1H20L25 7H14Z"></path>
              <circle class="train-lamp" cx="17" cy="-1" r="2"></circle>
            </g>
            <g class="travel-boat" id="travel-boat">
              <path class="boat-mast" d="M-3-17V4"></path>
              <path class="boat-sail" d="M-5-14V2H-19Z"></path>
              <path class="boat-sail" d="M0-10V2H14Z"></path>
              <path class="boat-hull" d="M-24 4H24L15 13H-16Z"></path>
              <path class="boat-deck" d="M-18 2H18V5H-18Z"></path>
              <path class="boat-flag" d="M-2-16H7L-2-12Z"></path>
            </g>
          </svg>
        </div>
        <p class="travel-caption" id="travel-caption">
          Ruten følger rekkefølgen på sangene.
        </p>
      </section>

      <header class="topbar">
        <p class="project-mark">KONSERTREISEN</p>
        <div class="topbar-right">
          <p class="slide-count" id="slide-count" aria-live="polite"></p>
          <button class="fullscreen-button" id="fullscreen-button" type="button">
            Fullskjerm
          </button>
        </div>
      </header>

      <section class="caption" aria-live="polite">
        <p class="place" id="place"></p>
        <h1 class="song" id="song"></h1>
        <p class="photo-status" id="photo-status" hidden></p>
      </section>

      <nav class="controls" aria-label="Kontroller for lysbildefremvisningen">
        <button id="previous-button" type="button" aria-label="Forrige sang">
          <span aria-hidden="true">&larr;</span>
        </button>
        <button id="next-button" type="button" aria-label="Neste sang">
          <span aria-hidden="true">&rarr;</span>
        </button>
      </nav>

      <footer class="key-hint" id="key-hint">
        <span>Trykk høyre pil eller mellomrom for neste land, eller venstre pil for forrige.</span>
        <span><kbd>F</kbd> Fullskjerm</span>
        <span><kbd>H</kbd> Skjul/vis kontroller</span>
      </footer>
    </main>
  </body>
</html>
